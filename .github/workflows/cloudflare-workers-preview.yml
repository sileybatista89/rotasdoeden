name: Cloudflare Workers preview

on:
  push:
    branches:
      - migration/cloudflare-workers-static-assets
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotas-cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build and publish staging preview
    if: github.ref == 'refs/heads/migration/cloudflare-workers-static-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      VITE_PAYMENTS_CLIENT_TOKEN: ${{ vars.VITE_PAYMENTS_CLIENT_TOKEN }}

    steps:
      - name: Check out Cloudflare branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm preview configuration targets staging
        shell: bash
        run: |
          set -euo pipefail
          expected_project='twdgrnivqodkxputzryt'
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_PUBLISHABLE_KEY" || -z "$VITE_SUPABASE_PROJECT_ID" ]]; then
            echo 'Set GitHub Actions variables VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, and VITE_SUPABASE_PROJECT_ID to the staging values.' >&2
            exit 1
          fi
          if [[ "$VITE_SUPABASE_PROJECT_ID" != "$expected_project" || "$VITE_SUPABASE_URL" != "https://${expected_project}.supabase.co" ]]; then
            echo 'Preview build blocked: Supabase configuration must point to the approved staging project.' >&2
            exit 1
          fi
          if [[ -n "$VITE_PAYMENTS_CLIENT_TOKEN" && "$VITE_PAYMENTS_CLIENT_TOKEN" != pk_test_* ]]; then
            echo 'Preview build blocked: VITE_PAYMENTS_CLIENT_TOKEN must be empty or a Stripe test publishable key.' >&2
            exit 1
          fi
          echo 'Preview configuration validated without printing key values.'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test -- --reporter=dot

      - name: Build preview assets
        run: npm run build -- --mode preview

      - name: Publish Cloudflare Workers Preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: preview --config ./wrangler.jsonc --name rotas-cloudflare-staging

      - name: Report preview URL
        if: ${{ steps.deploy.outputs.preview-url != '' }}
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        run: |
          printf 'Preview URL: %s\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
