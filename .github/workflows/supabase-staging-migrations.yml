name: Supabase staging migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview migrations first; choose apply only after reviewing a successful preview run.
        type: choice
        options:
          - preview
          - apply
        default: preview
        required: true
      confirm_project_ref:
        description: Required for apply. Enter the staging project ref exactly.
        type: string
        required: false

permissions:
  contents: read

jobs:
  migrations:
    name: Preview or apply staging migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      STAGING_PROJECT_REF: twdgrnivqodkxputzryt
      MODE: ${{ inputs.mode }}
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Validate staging connection without printing it
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          raw = os.environ.get("SUPABASE_STAGING_DB_URL", "")
          expected_ref = os.environ["STAGING_PROJECT_REF"]
          mode = os.environ["MODE"]
          confirmation = os.environ.get("CONFIRM_PROJECT_REF", "")

          if not raw:
              raise SystemExit("Missing repository secret SUPABASE_STAGING_DB_URL.")
          parsed = urlparse(raw)
          if parsed.scheme not in ("postgres", "postgresql"):
              raise SystemExit("The staging database URL must use PostgreSQL.")
          if parsed.port != 5432 or not parsed.hostname or not parsed.hostname.endswith(".pooler.supabase.com"):
              raise SystemExit("Use the Supabase session pooler URL on port 5432.")
          if unquote(parsed.username or "") != f"postgres.{expected_ref}":
              raise SystemExit("The URL username does not identify the approved staging project.")
          if not parsed.password or parsed.path.rstrip("/") != "/postgres":
              raise SystemExit("The staging connection URL is incomplete.")
          if mode == "apply" and confirmation != expected_ref:
              raise SystemExit("Apply requires confirm_project_ref to exactly match the staging project ref.")
          print("Staging connection target validated; the URL and password were not printed.")
          PY

      - name: Show migration history
        shell: bash
        run: supabase migration list --remote="$SUPABASE_STAGING_DB_URL"

      - name: Preview pending migrations
        shell: bash
        run: supabase db push --remote="$SUPABASE_STAGING_DB_URL" --dry-run --skip-vault

      - name: Apply reviewed migrations to staging
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: supabase db push --remote="$SUPABASE_STAGING_DB_URL" --yes --skip-vault

      - name: Verify applied migration history
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: supabase migration list --remote="$SUPABASE_STAGING_DB_URL"
